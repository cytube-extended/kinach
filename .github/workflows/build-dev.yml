name: Build & Publish project (dev branch)

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "dist/**"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      # All runs in this group are queued
      group: build-dev
      # Runs wait their turn (sequential execution)
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Install dependencies
        run: bun install

      - name: Run build
        run: bun run build

      - name: Publish
        uses: EndBug/add-and-commit@v10
        with:
          add: "dist --force"
          message: "CI: publish"
          default_author: github_actions
